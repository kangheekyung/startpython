<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>파이썬 기초 마스터 - 조건문</title>
	<!-- Pyodide 안정적인 최신 버전(v0.26.1)으로 지정 -->
	<script src="https://cdn.jsdelivr.net/pyodide/v0.26.1/full/pyodide.js"></script>
	<style>
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
			font-family: 'Nanum Gothic', 'Malgun Gothic', sans-serif;
		}

		body {
			background-color: #f4f9ff;
			color: #333;
			display: flex;
			flex-direction: column;
			align-items: center;
			padding: 20px;
			min-height: 100vh;
		}

		header {
			text-align: center;
			margin-bottom: 20px;
		}

		h1 {
			color: #2b580c;
			font-size: 2.2rem;
			margin-bottom: 15px;
			text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
		}

		nav {
			display: flex;
			gap: 12px;
			justify-content: center;
			flex-wrap: wrap;
		}

		.menu-btn {
			padding: 12px 24px;
			font-size: 1.1rem;
			font-weight: bold;
			border: 2px solid #63ace5;
			background-color: #ffffff;
			color: #63ace5;
			border-radius: 25px;
			cursor: pointer;
			transition: all 0.2s ease;
		}

		.menu-btn:hover {
			background-color: #e8f4f8;
		}

		.menu-btn.active {
			background-color: #ff7e5f;
			color: white;
			border-color: #ff7e5f;
			box-shadow: 0 4px 10px rgba(255, 126, 95, 0.4);
			transform: translateY(-2px);
		}

		main {
			width: 100%;
			max-width: 800px;
			background: white;
			border-radius: 15px;
			padding: 25px;
			box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
			margin-top: 20px;
		}

		.problem-nav {
			display: flex;
			gap: 8px;
			flex-wrap: wrap;
			margin-bottom: 25px;
			justify-content: center;
			border-bottom: 2px solid #f0f0f0;
			padding-bottom: 15px;
		}

		.problem-btn {
			padding: 8px 16px;
			font-size: 0.95rem;
			font-weight: bold;
			border: 1px solid #ddd;
			background-color: #f9f9f9;
			color: #555;
			border-radius: 8px;
			cursor: pointer;
			transition: all 0.2s ease;
		}

		.problem-btn:hover {
			background-color: #e3f2fd;
			color: #1976d2;
		}

		.problem-btn.active {
			background-color: #4caf50;
			color: white;
			border-color: #4caf50;
			box-shadow: 0 2px 6px rgba(76, 175, 80, 0.3);
		}

		.problem-card {
			border-left: 6px solid #ff7e5f;
			padding-left: 15px;
			margin-bottom: 20px;
		}

		.problem-title {
			font-size: 1.3rem;
			color: #222;
			margin-bottom: 10px;
		}

		.hint-box {
			background-color: #fff9e6;
			border: 1px solid #ffe599;
			border-radius: 8px;
			padding: 12px 15px;
			font-size: 0.95rem;
			color: #8a6d3b;
			margin-bottom: 20px;
		}

		.hint-box span {
			font-weight: bold;
			color: #d9534f;
		}

		.editor-container {
			display: flex;
			flex-direction: column;
			gap: 10px;
		}

		label {
			font-weight: bold;
			color: #555;
		}

		textarea {
			width: 100%;
			height: 300px;
			background-color: #282c34;
			color: #abb2bf;
			font-family: 'Consolas', 'Courier New', monospace;
			font-size: 1.05rem;
			padding: 15px;
			border-radius: 8px;
			border: none;
			resize: vertical;
			outline: none;
			line-height: 1.5;
		}

		.run-btn {
			align-self: flex-end;
			padding: 12px 30px;
			font-size: 1.1rem;
			font-weight: bold;
			color: white;
			background-color: #4caf50;
			border: none;
			border-radius: 8px;
			cursor: pointer;
			box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
			transition: background-color 0.2s;
		}

		.run-btn:hover {
			background-color: #45a049;
		}

		.run-btn:disabled {
			background-color: #ccc;
			cursor: not-allowed;
		}

		.output-container {
			margin-top: 15px;
		}

		.output-box {
			width: 100%;
			min-height: 80px;
			background-color: #f0f0f0;
			border: 1px solid #ddd;
			border-radius: 8px;
			padding: 12px;
			font-family: 'Consolas', 'Courier New', monospace;
			white-space: pre-wrap;
			color: #333;
		}

		#loading-msg {
			font-size: 0.9rem;
			color: #888;
			margin-left: 10px;
		}
	</style>
</head>

<body>

	<header>
		<h1>🐍 파이썬 기초 마스터</h1>
		<nav>
			<button class="menu-btn">연산자</button>
			<button class="menu-btn">변수</button>
			<button class="menu-btn active">조건문</button>
			<button class="menu-btn">반복문</button>
		</nav>
	</header>

	<main>
		<div class="problem-nav" id="problem-nav"></div>

		<section class="problem-card">
			<h2 class="problem-title" id="problem-title">1번 문제. 3의 배수 판별하기</h2>
			<p id="problem-desc">키보드로 양의 정수를 입력받아 3의 배수인지를 판별하는 프로그램을 작성하시오.</p>
		</section>

		<div class="hint-box" id="problem-hint">
			💡 <strong>힌트 :</strong> 3의 배수는 3으로 나눈 나머지가 <span>0</span>입니다. 나머지 연산자 <span>%</span>를 사용해보세요!
		</div>

		<div class="editor-container">
			<label for="code-editor">💻 파이썬 코드를 직접 입력해보세요:</label>
			<textarea id="code-editor" spellcheck="false"></textarea>

			<div style="display: flex; justify-content: flex-end; align-items: center;">
				<span id="loading-msg">파이썬 엔진 준비 중...</span>
				<button id="run-btn" class="run-btn" onclick="runPython()" disabled>▶ 실행하기</button>
			</div>
		</div>

		<div class="output-container">
			<label>🖥️ 실행 결과:</label>
			<div id="output" class="output-box">버튼을 누르면 실행 결과가 여기에 나와요!</div>
		</div>
	</main>

	<script>
		const problems = {
			1: {
				title: "1번 문제. 3의 배수 판별하기",
				desc: "키보드로 양의 정수를 입력받아 3의 배수인지를 판별하는 프로그램을 작성하시오.",
				hint: "💡 <strong>힌트 :</strong> 3의 배수는 3으로 나눈 나머지가 <span>0</span>입니다. 나머지 연산자 <span>%</span>를 사용해보세요!",
				defaultCode: `# 예시 코드를 수정해서 문제를 풀어보세요\n\nnum = int(input("양의 정수를 입력하세요: "))\n\nif num % 3 == 0:\n    print("3의 배수입니다.")\nelse:\n    print("3의 배수가 아닙니다.")`,
				userCode: null
			},
			2: {
				title: "2번 문제. 비밀번호 확인하기",
				desc: "키보드로 비밀번호를 입력받아 그 비밀번호가 맞는지 확인하는 프로그램을 작성하시오.",
				hint: "💡 <strong>힌트 :</strong> 비밀번호는 <span>문자열</span>로 처리합니다. 정답 비밀번호를 변수에 미리 설정해 놓고 입력받은 값과 비교해보세요!",
				defaultCode: `# 비밀번호를 입력받아 맞는지 확인해봅시다.\n\npw = "1234"\nuser_pw = input("비밀번호를 입력하세요: ")\n\nif user_pw == pw:\n    print("비밀번호가 맞습니다!")\nelse:\n    print("비밀번호가 틀렸습니다!")`,
				userCode: null
			},
			3: {
				title: "3번 문제. 짝수/홀수 판별하기",
				desc: "키보드로 정수를 입력받아 짝수인지 홀수인지 판별하는 프로그램을 작성하시오.",
				hint: "💡 <strong>힌트 :</strong> 입력받은 값은 <span>int()</span>로 정수 형변환을 해야 합니다. 짝수는 2로 나눈 나머지가 <span>0</span>이므로, 나머지 연산자 <span>%</span>를 사용해보세요!",
				defaultCode: `# 정수를 입력받아 짝수/홀수를 판별해봅시다.\n\nnum = int(input("정수를 입력하세요: "))\n\nif num % 2 == 0:\n    print("짝수입니다.")\nelse:\n    print("홀수입니다.")`,
				userCode: null
			},
			4: {
				title: "4번 문제. 성별 판정하기",
				desc: "키보드로 주민번호 뒷자리 첫 번째 숫자를 입력받아 남녀를 판정하는 프로그램을 작성하시오.",
				hint: "💡 <strong>힌트 :</strong> 주민번호 뒷자리 첫 번째 숫자가 <span>1</span> 또는 <span>3</span>이면 남성, <span>2</span> 또는 <span>4</span>이면 여성입니다.",
				defaultCode: `# 주민번호 뒷자리 첫 번째 숫자를 입력받아 성별을 판정해봅시다.\n\nnum = int(input("주민번호 뒷자리 첫 번째 숫자를 입력하세요: "))\n\nif num == 1 or num == 3:\n    print("남성입니다.")\nelif num == 2 or num == 4:\n    print("여성입니다.")\nelse:\n    print("잘못된 입력입니다.")`,
				userCode: null
			},
			5: {
				title: "5번 문제. 놀이공원 입장료 계산하기",
				desc: "나이를 입력받아 8세 미만은 '무료', 8세 이상 60세 미만은 '10,000원', 60세 이상은 '5,000원'을 출력하는 프로그램을 작성하시오.",
				hint: "💡 <strong>힌트 :</strong> 여러 조건을 비교할 때는 <span>elif</span>를 사용합니다.",
				defaultCode: `age = int(input("나이를 입력하세요: "))\n\nif age < 8:\n    print("무료입니다.")\nelif age < 60:\n    print("입장료는 10,000원입니다.")\nelse:\n    print("입장료는 5,000원입니다.")`,
				userCode: null
			},
			6: {
				title: "6번 문제. 시험 점수로 학점 구하기",
				desc: "0~100 사이의 시험 점수를 입력받아 90점 이상은 'A', 80점 이상은 'B', 70점 이상은 'C', 그 외는 'F'학점을 출력하는 프로그램을 작성하시오.",
				hint: "💡 <strong>힌트 :</strong> <span>if - elif - else</span> 구문을 활용하세요.",
				defaultCode: `score = int(input("점수를 입력하세요: "))\n\nif score >= 90:\n    print("A학점입니다.")\nelif score >= 80:\n    print("B학점입니다.")\nelif score >= 70:\n    print("C학점입니다.")\nelse:\n    print("F학점입니다.")`,
				userCode: null
			},
			7: {
				title: "7번 문제. 양수, 음수, 0 구분하기",
				desc: "정수를 입력받아 양수인지, 음수인지, 아니면 0인지를 판별하여 출력하는 프로그램을 작성하시오.",
				hint: "💡 <strong>힌트 :</strong> <span>></span> 와 <span><</span> 연산자를 사용해보세요!",
				defaultCode: `num = int(input("정수를 입력하세요: "))\n\nif num > 0:\n    print("양수입니다.")\nelif num < 0:\n    print("음수입니다.")\nelse:\n    print("0입니다.")`,
				userCode: null
			},
			8: {
				title: "8번 문제. 두 수 중 큰 수 찾기",
				desc: "두 개의 정수를 입력받아 둘 중 더 큰 수를 출력하고, 두 수가 같으면 '두 수가 같습니다'를 출력하는 프로그램을 작성하시오.",
				hint: "💡 <strong>힌트 :</strong> 두 수를 각각 입력받아 비교해보세요!",
				defaultCode: `a = int(input("첫 번째 정수: "))\nb = int(input("두 번째 정수: "))\n\nif a > b:\n    print("더 큰 수:", a)\nelif b > a:\n    print("더 큰 수:", b)\nelse:\n    print("두 수가 같습니다.")`,
				userCode: null
			},
			9: {
				title: "9번 문제. 계절 맞히기",
				desc: "월(1~12)을 입력받아 3~5월은 '봄', 6~8월은 '여름', 9~11월은 '가을', 12, 1, 2월은 '겨울'을 출력하는 프로그램을 작성하시오.",
				hint: "💡 <strong>힌트 :</strong> <span>3 <= month <= 5</span> 형태로 범위를 조건식으로 세워보세요!",
				defaultCode: `month = int(input("월을 입력하세요(1~12): "))\n\nif 3 <= month <= 5:\n    print("봄입니다.")\nelif 6 <= month <= 8:\n    print("여름입니다.")\nelif 9 <= month <= 11:\n    print("가을입니다.")\nelse:\n    print("겨울입니다.")`,
				userCode: null
			},
			10: {
				title: "10번 문제. 주사위 행운의 숫자 맞히기 (random 모듈)",
				desc: "random 모듈을 사용하여 1~6 사이의 주사위 번호를 뽑은 뒤, 사용자가 입력한 예상 번호와 일치하면 '당첨!', 틀리면 '아쉽네요!'를 출력하는 프로그램을 작성하시오.",
				hint: "💡 <strong>힌트 :</strong> <span>import random</span>과 <span>random.randint(1, 6)</span>을 사용합니다!",
				defaultCode: `import random\n\ndice = random.randint(1, 6)\nuser_guess = int(input("1~6 중 예상이 되는 주사위 눈을 입력하세요: "))\n\nprint("주사위 결과:", dice)\n\nif user_guess == dice:\n    print("🎉 당첨입니다!")\nelse:\n    print("😅 아쉽네요, 틀렸습니다!")`,
				userCode: null
			}
		};

		let currentProblemId = 1;
		let pyodideReady = false;
		let pyodide = null;

		function init() {
			renderProblemButtons();
			loadProblem(1);
		}

		function renderProblemButtons() {
			const navContainer = document.getElementById('problem-nav');
			navContainer.innerHTML = '';

			for (let i = 1; i <= 10; i++) {
				const btn = document.createElement('button');
				btn.className = `problem-btn ${i === currentProblemId ? 'active' : ''}`;
				btn.innerText = `문제 ${i}`;
				btn.onclick = () => switchProblem(i);
				navContainer.appendChild(btn);
			}
		}

		function switchProblem(id) {
			const currentEditorCode = document.getElementById('code-editor').value;
			problems[currentProblemId].userCode = currentEditorCode;

			currentProblemId = id;

			const buttons = document.querySelectorAll('.problem-btn');
			buttons.forEach((btn, idx) => {
				btn.classList.toggle('active', idx + 1 === id);
			});

			loadProblem(id);
		}

		function loadProblem(id) {
			const prob = problems[id];
			document.getElementById('problem-title').innerText = prob.title;
			document.getElementById('problem-desc').innerText = prob.desc;
			document.getElementById('problem-hint').innerHTML = prob.hint;

			const codeToLoad = prob.userCode !== null ? prob.userCode : prob.defaultCode;
			document.getElementById('code-editor').value = codeToLoad;
			document.getElementById('output').innerText = "버튼을 누르면 실행 결과가 여기에 나와요!";
		}

		// Pyodide 초기화 및 표준 입출력 1회 재정의
		async function main() {
			try {
				pyodide = await loadPyodide();

				// 파이썬 환경 초기화 (input과 stdout 세팅을 한번에 처리)
				await pyodide.runPythonAsync(`
					import sys
					import io
					import js

					class CustomOutput:
						def __init__(self):
							self.buffer = ""
						def write(self, text):
							self.buffer += str(text)
						def flush(self):
							pass
						def get_value(self):
							val = self.buffer
							self.buffer = ""
							return val

					sys.stdout = CustomOutput()

					def custom_input(prompt=""):
						res = js.prompt(str(prompt))
						if res is None:
							return ""
						return str(res)

					__builtins__.input = custom_input
				`);

				pyodideReady = true;
				document.getElementById('loading-msg').innerText = "파이썬 준비 완료!";
				document.getElementById('run-btn').disabled = false;
			} catch (err) {
				document.getElementById('loading-msg').innerText = "파이썬 로딩 실패";
				document.getElementById('output').innerText = "❌ 파이썬 엔진을 불러오는 중 오류가 발생했습니다: " + err.message;
			}
		}

		window.onload = () => {
			init();
			main();
		};

		// 파이썬 코드 실행 (비동기 안전 처리)
		async function runPython() {
			if (!pyodideReady) return;

			const runBtn = document.getElementById('run-btn');
			const outputBox = document.getElementById('output');

			// 중복 클릭 방지 및 상태 표시
			runBtn.disabled = true;
			outputBox.innerText = "실행 중입니다... (입력창이 뜨면 값을 입력해주세요)";

			const code = document.getElementById('code-editor').value;

			try {
				// 버퍼 초기화
				pyodide.runPython("sys.stdout.buffer = ''");

				// 사용자 코드 실행 (비동기)
				await pyodide.runPythonAsync(code);

				// 실행 결과 출력 가져오기
				let stdout = pyodide.runPython("sys.stdout.get_value()");
				outputBox.innerText = stdout.trim() !== "" ? stdout : "실행이 완료되었습니다. (출력 결과 없음)";

			} catch (err) {
				outputBox.innerText = "❌ 오류가 발생했어요:\n" + err.message;
			} finally {
				// 실행 완료 후 다시 버튼 활성화
				runBtn.disabled = false;
			}
		}
	</script>
</body>

</html>
