<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>파이썬 기초 마스터 v4 · 3 챕터 · OX 퀴즈 · 직접 타이핑 연습</title>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<style>
:root{
 --p:#4f46e5; --p2:#7c3aed; --p3:#06b6d4;
 --ink:#262837; --sub:#6b7280; --line:#e3e8f5;
 --bg:#eef2fc; --card:#fff; --soft:#f8f9ff;
 --ok:#16a34a; --okbg:#eafaf1;
 --no:#ef4444; --nobg:#fdeeef;
 --codebg:#1e2233; --codefg:#d7def2;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;-webkit-text-size-adjust:100%}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 80px}
.hero{background:linear-gradient(135deg,#4f46e5,#7c3aed 55%,#06b6d4);color:#fff;padding:46px 20px 40px;text-align:center;border-radius:0 0 30px 30px}
.hero .snake{font-size:48px;line-height:1}
.hero h1{font-size:30px;margin:6px 0 4px}
.hero .sub{font-size:16px;opacity:.95}
.badges{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.badge{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);padding:4px 12px;border-radius:999px;font-size:13px;font-weight:600}
nav.sticky{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 0}
nav .navIn{max-width:980px;margin:0 auto;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.navBtn{font-family:inherit;border:1px solid #c7d2fe;background:#eef2ff;color:#4338ca;border-radius:10px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.navBtn.ghost{background:#fff;color:#4f46e5}
.progressBar{height:8px;width:200px;background:#e5e9f7;border-radius:999px;overflow:hidden}
.progressBar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#4f46e5,#06b6d4);border-radius:999px;transition:width .35s}
.chapNavLinks{display:flex;gap:6px;flex-wrap:wrap}
section{margin-top:28px;display:block}
.chapterHead{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 20px;margin-bottom:14px;box-shadow:0 2px 10px rgba(67,56,202,.06)}
.chapterHead .num{width:48px;height:48px;font-size:20px;font-weight:800;color:#fff;background:linear-gradient(135deg,#4f46e5,#7c3aed);border-radius:12px;display:flex;align-items:center;justify-content:center}
.chapterHead h2{font-size:22px;color:#3730a3}
.chapterHead .tag{font-size:13px;color:var(--sub);margin-top:2px}
.partTabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.partTab{font-family:inherit;border:2px solid var(--line);background:#fff;padding:9px 16px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink)}
.partTab.active{background:linear-gradient(90deg,#4f46e5,#7c3aed);color:#fff;border-color:transparent}
/* 핵심: partPanel 숨김/표시 명시 */
.partPanel{display:block}
.partPanel.hide{display:none !important}
.card{background:var(--card);border-radius:18px;box-shadow:0 4px 18px rgba(67,56,202,.08);padding:22px;margin-bottom:18px;border:1px solid var(--line)}
.card h3{font-size:18px;color:#3730a3;margin-bottom:6px}
.card p.lead{color:var(--sub);font-size:14px;margin-bottom:12px}
.preRow{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;margin:10px 0;align-items:center}
pre{margin:0;font-family:'D2Coding','JetBrains Mono',Consolas,monospace;font-size:14.5px;padding:10px 12px;border-radius:10px;overflow-x:auto;white-space:pre-wrap;word-break:break-all}
.code{background:var(--codebg);color:var(--codefg)}
.result{background:var(--okbg);color:#14532d;border:1px solid #bbf7d0;font-weight:600}
.arrow{text-align:center;color:#94a3b8;font-size:16px}
.tips{margin-top:10px;padding:0;list-style:none}
.tips li{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:8px 12px 8px 36px;position:relative;margin-bottom:6px;font-size:14px}
.tips li::before{content:"💡";position:absolute;left:10px;top:8px}
/* ── 직접 타이핑 연습기 (v4 핵심) ── */
.typeExercise{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 4px 18px rgba(67,56,202,.08)}
.typeGoal{display:flex;align-items:flex-start;gap:12px;background:linear-gradient(90deg,#eef2ff,#ecfdf5);border:1px solid #c7d2fe;border-radius:14px;padding:14px 18px;margin-bottom:12px}
.typeGoal .badge{background:linear-gradient(90deg,#4f46e5,#7c3aed);color:#fff;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:700;flex:0 0 auto}
.typeGoal .body{flex:1}
.typeGoal h3{font-size:17px;color:#3730a3;margin-bottom:4px}
.typeGoal p{font-size:14px;color:#374151}
.typeGoal .labelWant{margin-top:8px;background:#1e2233;color:#4ade80;padding:8px 12px;border-radius:8px;font-family:'D2Coding','JetBrains Mono',Consolas,monospace;font-size:15px;display:inline-block}
.editorWrap{background:var(--codebg);border-radius:14px;overflow:hidden;border:1px solid #2a3050}
.editorHead{display:flex;justify-content:space-between;align-items:center;background:#161a2c;padding:10px 14px;color:#a8b1cf;font-size:13px;flex-wrap:wrap;gap:6px}
.editorHead .dot{width:10px;height:10px;border-radius:50%;background:#fbbf24;display:inline-block;margin-right:6px}
.editorHead button{font-family:inherit;border:none;color:#fff;padding:9px 14px;border-radius:8px;font-weight:700;cursor:pointer;font-size:13px}
.runBtnGo{background:linear-gradient(90deg,#4f46e5,#06b6d4) !important}
.runBtnHint{background:#475569 !important}
.runBtnReveal{background:#7c3aed !important}
.runBtnNext{background:#16a34a !important}
.editorHead button[disabled]{opacity:.5;cursor:not-allowed}
.editorHead .meta{font-size:12px;color:#7a86a6;margin-right:6px}
textarea.codeArea{width:100%;min-height:130px;background:var(--codebg);color:var(--codefg);border:none;outline:none;padding:14px 18px;font-family:'D2Coding','JetBrains Mono',Consolas,monospace;font-size:15px;line-height:1.7;resize:vertical;tab-size:2}
textarea.codeArea::placeholder{color:#525a7a}
.outBox{background:#0f1322;color:#a7e9af;padding:14px 18px;font-family:'D2Coding','JetBrains Mono',Consolas,monospace;font-size:14px;min-height:48px;border-top:1px solid #2a3050;white-space:pre-wrap;word-break:break-all}
.outBox.err{color:#fca5a5}
.outBox .okmsg{color:#a7e9af;font-weight:700;margin-right:8px}
.outBox.matched{background:#0a1f15}
.pyLoading{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;padding:22px;border-radius:14px;margin-bottom:14px;display:flex;align-items:center;gap:14px;font-weight:600}
.loader{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
/* ── 연습문제 / OX 공통 ── */
.qBar{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.ansInput{width:100%;padding:11px 14px;font-size:16px;border:2px solid var(--line);border-radius:12px;font-family:inherit;background:#fff}
.ansInput:focus{outline:none;border-color:#818cf8}
.btn{display:inline-block;border:none;cursor:pointer;font-family:inherit;font-weight:700;padding:11px 20px;border-radius:12px;font-size:15px;transition:.15s}
.btn.go{background:linear-gradient(90deg,#4f46e5,#7c3aed);color:#fff}
.btn:active{transform:scale(.97)}
.fb{border-radius:12px;padding:13px 15px;margin-top:11px;font-size:15px;display:none}
.fb.show{display:block;animation:fade .25s}
.fb.ok{background:var(--okbg);border:1px solid #bbf7d0}
.fb.no{background:var(--nobg);border:1px solid #fecaca}
.fb .head{font-weight:800;font-size:16px;margin-bottom:5px}
.fb .explain{margin-top:8px;background:rgba(255,255,255,.78);border-radius:8px;padding:8px 11px;font-size:14px}
.fb .ansLine{font-size:14px;color:var(--sub);margin-top:6px}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
.diffBadge{display:inline-block;font-size:12px;padding:2px 10px;border-radius:999px;font-weight:700;margin-left:6px}
.diffBadge.easy{background:#dcfce7;color:#15803d}
.diffBadge.hard{background:#fee2e2;color:#b91c1c}
/* OX */
.oxCol{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.oxCard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.oxChoiceRow{display:flex;gap:8px;margin-top:4px}
.oxOXBtn{flex:1;font-family:inherit;border:none;color:#fff;padding:10px;border-radius:10px;font-weight:700;cursor:pointer;font-size:14px}
.oxOXBtn.O{background:linear-gradient(90deg,#16a34a,#22c55e)}
.oxOXBtn.X{background:linear-gradient(90deg,#ef4444,#dc2626)}
.oxOXBtn:disabled{opacity:.55;cursor:not-allowed}
.oxName{font-family:'D2Coding','JetBrains Mono',Consolas,monospace;background:#eef2ff;color:#4338ca;padding:2px 8px;border-radius:6px;font-size:14.5px}
/* 결과 차트 */
.endCard{text-align:center;padding:30px 20px}
.endCard .big{font-size:56px}
.endCard .score{font-size:30px;font-weight:800;color:#3730a3;margin:8px 0}
.endCard .msg{color:var(--sub);font-size:16px;margin-bottom:18px}
.endChartBox{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:18px;margin:18px 0;text-align:left}
footer{margin-top:40px;text-align:center;color:var(--sub);font-size:13px;padding-bottom:20px}
@media(max-width:620px){
 .hero h1{font-size:24px}
 .preRow{grid-template-columns:1fr}
 .preRow .arrow{display:none}
 pre{font-size:12.5px}
 .oxCol{grid-template-columns:1fr}
 .progressBar{width:140px}
}
</style>
</head>
<body>
<header class="hero">
 <div class="snake">🐍</div>
 <h1>파이썬 기초 마스터 v4</h1>
 <div class="sub">초등 6학년 · print · 연산자 · 변수 · <span style="background:#fbbf24;color:#1e2233;padding:3px 10px;border-radius:999px;font-weight:800;font-size:14px">⭐ 직접 타이핑 연습</span></div>
 <div class="badges">
 <span class="badge">📖 3 챕터</span>
 <span class="badge">🎮 직접 타이핑 챕터당 10</span>
 <span class="badge">📝 주관식 문제 챕터당 20</span>
 <span class="badge">⚖️ OX 챕터당 20</span>
 <span class="badge">▶️ 실제 파이썬 실행</span>
 </div>
</header>
<nav class="sticky">
 <div class="navIn">
 <div class="chapNavLinks">
 <a class="navBtn ghost" href="#ch1">① print</a>
 <a class="navBtn ghost" href="#ch2">② 연산자</a>
 <a class="navBtn ghost" href="#ch3">③ 변수</a>
 </div>
 <div style="display:flex;align-items:center;gap:10px">
 <div class="progressBar"><i id="pbar"></i></div>
 <div style="font-size:13px;color:var(--sub);white-space:nowrap" id="navCount">0/80 완료</div>
 </div>
 </div>
</nav>
<div class="wrap">
 <div id="pyLoadingBar" class="pyLoading">
 <span class="loader"></span>
 <span>파이썬 엔진(Pyodide)을 처음에 한 번만 불러 오는 중... (보통 5~15초)</span>
 </div>
 <div id="chapContainer"></div>
</div>
<footer>🐍 파이썬 마스터 v4 · 초등 6학년용 · 직접 타이핑이 학습의 핵심 🔑 · 모든 채점은 브라우저 안에서</footer>
<script>
"use strict";

/* ============================================================
   데이터: 3 챕터 통합 — 개념 예시, 직접 타이핑 예제, 주관식 문제, OX
   ============================================================ */

// ── 직접 타이핑 연습 (챕터당 10) ──
// 각 예제: task = 목표 출력, hint = 단계별 힌트(2단계), answer = 정답 코드, starter = 빈 슬라이스
// 핵심: starter 에는 정답 코드가 미리 들어가 있지 않음
const TYPE_EX = {
 1: [
 { task:'안녕', hintA:'print 라는 명령을 사용해 보세요. 글자를 출력할 때는 양쪽에 " 기호를 붙여요.', hintB:'print 와 ( 와 " 와 안녕 과 " 와 ) 를 순서대로 써 보세요.',
 answer:'print("안녕")', starter:'# 여기에 코드를 직접 입력해 보세요\n' },
 { task:'7', hintA:'숫자 7 을 그대로 출력해 보세요. 숫자는 따옴표 없이 써요.', hintB:'print(7) 처럼 괄호 안에 숫자만 넣어 주면 돼요.',
 answer:'print(7)', starter:'# print( 숫자 ) 형태로 입력해 보세요\n' },
 { task:'1 2 3', hintA:'여러 값을 한 줄에 출력할 때는 쉼표(,) 로 구분해요.', hintB:'print(1, 2, 3) 처럼 쉼표로 나란히 써 보세요.',
 answer:'print(1, 2, 3)', starter:'# 쉼표로 값을 나란히 출력해 보세요\n' },
 { task:'가-나', hintA:'두 글자를 하이픈(-) 으로 연결해 출력해요. sep 옵션이 필요해요.', hintB:'출력 옵션은 print(..., sep="-") 처럼 안쪽에 적어요.',
 answer:'print("가", "나", sep="-")', starter:'# sep 옵션으로 두 글자를 - 로 연결해 보세요\n' },
 { task:'안녕!', hintA:'print 는 출력 뒤에 자동으로 줄바꿈을 해요. 줄바꿈 대신 ! 를 붙이려면 end 옵션!', hintB:'print("안녕", end="!") 처럼 마지막 글자를 지정해 줘요.',
 answer:'print("안녕", end="!")', starter:'# end 옵션으로 줄바꿈 대신 ! 를 붙여 보세요\n' },
 { task:'a+b+c', hintA:'세 글자를 + 로 연결해 출력해요.', hintB:'sep 옵션을 사용하면 돼요.',
 answer:'print("a", "b", "c", sep="+")', starter:'# sep 옵션을 활용해 보세요\n' },
 { task:'파이썬공부', hintA:'두 글자를 이어 붙여 출력해요. 문자열끼리는 + 로 결합!', hintB:'print("파이썬" + "공부") 처럼 + 로 글자를 합쳐요.',
 answer:'print("파이썬" + "공부")', starter:'# 두 글자를 + 로 합쳐 보세요\n' },
 { task:'안녕안녕', hintA:'같은 글자를 두 번 반복해 출력해요. 문자열 × 숫자!', hintB:'문자열에 * 2 를 하면 글자가 두 번 반복돼요.',
 answer:'print("안녕" * 2)', starter:'# 글자를 2번 반복해 보세요\n' },
 { task:'Happy🎉Birthday!', hintA:'출력은 Hi 가 아니라 두 글자와 🎉 그리고 ! 가 모두 보여야 해요.', hintB:'print("Happy", "🎉", "Birthday", sep="") 와 print(... , end="!") 두 개를 써 보세요.',
 answer:'print("Happy", end="")\nprint("🎉", end="")\nprint("Birthday!")', starter:'# 3줄에 나눠 출력해 보세요\n' },
 { task:'Bye', hintA:'숫자도 출력할 수 있어요.', hintB:'print(2024) 처럼 숫자를 그대로 출력!',
 answer:'print("Bye")', starter:'# Bye 를 출력해 보세요\n' }
 ],
 2: [
 { task:'9', hintA:'5 + 4 를 출력해 보세요.', hintB:'print(5 + 4) 는 숫자 계산 결과를 출력해요.',
 answer:'print(5 + 4)', starter:'# 숫자 계산을 출력해 보세요\n' },
 { task:'2.5', hintA:'10 ÷ 4 를 출력해 보세요. / 는 항상 소수!', hintB:'print(10 / 4) 는 2.5 가 나와요.',
 answer:'print(10 / 4)', starter:'# / 연산자(나누기)로 계산해 보세요\n' },
 { task:'3', hintA:'7 ÷ 2 의 몫을 출력해 보세요.', hintB:'// 는 몫을 구해요. 7//2 = 3',
 answer:'print(7 // 2)', starter:'# // 연산자를 사용해 보세요\n' },
 { task:'1', hintA:'7 ÷ 2 의 나머지를 출력해 보세요.', hintB:'% 연산자는 나머지를 구해요.',
 answer:'print(7 % 2)', starter:'# % 연산자를 사용해 보세요\n' },
 { task:'16', hintA:'4 의 2제곱을 출력해 보세요.', hintB:'거듭제곱은 ** 연산자. 4**2 = 16',
 answer:'print(4 ** 2)', starter:'# 거듭제곱 ** 를 사용해 보세요\n' },
 { task:'20', hintA:'(2 + 3) × 4 를 계산해 보세요. 곱셈이 덧셈보다 먼저!', hintB:'괄호로 묶으면 (2+3) 가 먼저 계산돼요.',
 answer:'print((2 + 3) * 4)', starter:'# 괄호를 활용해 보세요\n' },
 { task:'14', hintA:'2 + 3 × 4 를 계산해 보세요.', hintB:'곱셈이 먼저! 3×4=12, 2+12=14',
 answer:'print(2 + 3 * 4)', starter:'# 곱셈이 먼저 계산되도록 작성해 보세요\n' },
 { task:'6', hintA:'100 // 7 의 결과를 출력해 보세요.', hintB:'// 는 몫. 100÷7 = 14···2 → 몫은 14',
 answer:'print(100 // 7 // 2)', starter:'# // 연산자를 두 번 활용해 보세요 (100 먼저 7 로, 그 다음 2 로)\n' },
 { task:'32', hintA:'2 의 5제곱을 출력해 보세요.', hintB:'** 5 는 거듭제곱. 2**5 = 32',
 answer:'print(2 ** 5)', starter:'# 2 의 5제곱을 출력해 보세요\n' },
 { task:'100', hintA:'10 × 10 을 출력해 보세요!', hintB:'print(10 * 10)',
 answer:'print(10 * 10)', starter:'# 간단한 곱셈 출력해 보기\n' }
 ],
 3: [
 { task:'코딩', hintA:'name 이라는 변수에 "코딩" 을 담아 보세요.', hintB:'name = "코딩" 처럼 변수에 값을 담고 print(name) 으로 출력해요.',
 answer:'name = "코딩"\nprint(name)', starter:'# 변수에 글자를 담아 출력해 보세요\n' },
 { task:'13', hintA:'age 라는 변수에 자기 나이 13 을 담아 보세요.', hintB:'age = 13 → print(age)',
 answer:'age = 13\nprint(age)', starter:'# 숫자 변수를 만들어 출력해 보세요\n' },
 { task:'12', hintA:'x=5, y=7 의 합을 출력해 보세요.', hintB:'print(x + y) 로 변수끼리 더해요.',

/* ============================================================
   페이지 빌드: ① 챕터 컨테이너에 모든 챕터 + partPanel 동적 생성
   ============================================================ */
function buildChapters(){
 const wrap = document.getElementById('chapContainer');
 const html = [];
 for (const ch of [1,2,3]){
 const parts = CHAP_PARTS[ch];
 html.push('<section id="ch'+ch+'">');
 html.push('<div class="chapterHead"><div class="num">'+ch+'</div><div><h2>Chapter '+ch+' · '+(ch===1?'print 구문':(ch===2?'연산자':'변수'))+'</h2><div class="tag">'+CHAP_INTRO[ch]+'</div></div></div>');
 // 탭
 html.push('<div class="partTabs" data-chap="'+ch+'">');
 parts.forEach((p, i) => { html.push('<button class="partTab'+(i===0?' active':'')+'" data-part="'+p+'">'+PART_LABEL[p]+'</button>'); });
 html.push('</div>');
 // partPanel 들
 parts.forEach((p, i) => {
 html.push('<div class="partPanel'+((i!==0)?' hide':'')+'" data-chap="'+ch+'" data-part="'+p+'" id="panel-'+ch+'-'+p+'"></div>');
 });
 html.push('</section>');
 }
 wrap.innerHTML = html.join('');
}

let pyReady = null;
function loadPy(){ if (pyReady) return pyReady; pyReady = (async () => { const py = await window.loadPyodide({ indexURL:"https://cdn.jsdelivr.net/pyodide/v0.26.4/full/" }); return py; })(); return pyReady; }
async function ensurePy(){ await loadPy(); const b = document.getElementById("pyLoadingBar"); if (b) b.style.display = "none"; }
async function runPy(code){
 const py = await ensurePy();
 py.runPython('import sys, io\n_b=io.StringIO()\nsys.stdout=_b\ndef _f():\n v=_b.getvalue(); sys.stdout=sys.__stdout__; return v\n');
 try { py.runPython(code); } finally { return String(py.runPython("_f()") || ""); }
}

/* ============================================================
   사용 유틸
   ============================================================ */
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function normOut(s){ return String(s).trim().replace(/\r/g,"").replace(/ +/g," ").replace(/\n+$/,"").replace(/^ +/gm,""); }

/* ============================================================
   직접 타이핑 연습 (v4 핵심) — 정답이 미리 들어 있지 않은 starter
   ============================================================ */
const typeState = { 1: null, 2: null, 3: null };

function loadTypeExercise(ch){
 const idx = typeState[ch];
 const item = TYPE_EX[ch][idx];
 const panel = document.getElementById('panel-'+ch+'-practice');

 <div class="typeGoal">
 <span class="badge">⌨️ 예제 ${idx+1} / ${TYPE_EX[ch].length}</span>
 <div class="body">
 <h3>🎯 이 예제의 목표: 다음 결과를 출력해 보세요.</h3>
 <span class="labelWant">${esc(item.task)}</span>
 <p style="margin-top:8px;font-size:13.5px;color:#4b5563"><b>📖 방법:</b> 아래 빈 곳에 파이썬 코드를 <b>직접 입력</b>해 보세요. 정답 코드가 미리 적혀 있지 않아요!</p>
 </div>
 </div>
 <div class="editorWrap">
 <div class="editorHead">
 <span><span class="dot"></span>${ch===1?'print':(ch===2?'연산자':'변수')} · 예제 ${idx+1}/${TYPE_EX[ch].length}</span>
 <div>

 <button class="runBtnHint" data-type-hint="${ch}">💡 힌트</button>
 <button class="runBtnHint" data-type-reveal="${ch}" style="background:#dc2626">👀 정답 보기</button>
 <button class="runBtnGo" data-type-run="${ch}">▶ 실행</button>
 <button class="runBtnNext" data-type-next="${ch}">🔄 새 문제</button>
 </div>
 </div>
 <textarea class="codeArea" id="ed${ch}" spellcheck="false">${esc(item.starter)}</textarea>
 <div class="outBox" id="out${ch}">▶ 직접 코드를 입력하고 ▶ 실행 버튼을 눌러 주세요!</div>
 </div>
 <div style="margin-top:14px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:14.5px">
 <b>🎓 학습 효과:</b> 예제마다 <b>10번</b> 직접 타이핑하면서 손에 익혀요. 처음엔 힌트 OK, 익숙해지면 정답 보기 없이 풀 수 있게 도전!
 </div>
 </div>`;
 bindTypeExercise(ch);
 resumeTypeExercise(ch);
}

function resumeTypeExercise(ch){
 // textarea 가 존재하면 Tab 키 핸들러 부착
 const ta = document.getElementById('ed' + ch);
 if (ta && !ta.dataset.tab){
 ta.dataset.tab = "1";
 ta.addEventListener('keydown', e => {
 if (e.key === 'Tab'){
 e.preventDefault();
 const s = ta.selectionStart, end = ta.selectionEnd;
 ta.value = ta.value.substring(0, s) + "  " + ta.value.substring(end);
 ta.selectionStart = ta.selectionEnd = s + 2;
 }
 });
 }
}

function bindTypeExercise(ch){
 const idx = typeState[ch];
 document.querySelector('[data-type-run="'+ch+'"]')?.addEventListener('click', async () => {
 const ta = document.getElementById('ed'+ch);
 const out = document.getElementById('out'+ch);
 out.classList.remove('err','matched'); out.textContent = "⏳ 실행 중...";
 try {
 const result = await runPy(ta.value);
 const got = normOut(result);
 const want = normOut(TYPE_EX[ch][idx].task);
 if (got === want){
 out.classList.add('matched');
 out.innerHTML = '<span class="okmsg">✅ 정답이에요! 출력 결과가 일치합니다.</span><br><b>실제 출력:</b><br>'+esc(got);
 } else {
 out.classList.add('err');
 out.innerHTML = '<span class="okmsg" style="color:#fca5a5">⚠️ 출력 불일치</span><br><b>내가 실행한 결과:</b><br>'+esc(got || '(출력 없음)') + '<br><br><b>목표 출력:</b><br>'+esc(want);
 }
 } catch (err){
 out.classList.add('err');
 out.innerHTML = '<span class="okmsg" style="color:#fca5a5">⚠️ 에러:</span>' + esc(String(err.message||err));
 }
 });
 document.querySelector('[data-type-hint="'+ch+'"]')?.addEventListener('click', () => {
 const item = TYPE_EX[ch][idx];
 const ta = document.getElementById('ed'+ch);
 const isFirst = ta.value.trim() === item.starter.replace('#','').trim() || ta.value.trim() === '';
 const next = isFirst ? item.hintA : item.hintB;
 alert('💡 힌트\n\n' + next);
 });
 document.querySelector('[data-type-reveal="'+ch+'"]')?.addEventListener('click', () => {
 const item = TYPE_EX[ch][idx];
 const ta = document.getElementById('ed'+ch);
 if (confirm('정답 코드를 보여줄까요? (이후 실행해도 더 이상 정답 체크가 적용되지 않아요!)')){
 ta.value = item.answer;
 ta.readOnly = true;
 document.getElementById('tMeta'+ch).innerHTML = '<span style="color:#fbbf24">정답 보기 모드 (자유 실행만 가능)</span>';
 }
 });
 document.querySelector('[data-type-next="'+ch+'"]')?.addEventListener('click', () => {
 typeState[ch] = (typeState[ch] + 1) % TYPE_EX[ch].length;
 loadTypeExercise(ch);
 });
}

const userAnswers = {};
function renderQuiz(chap){
 const panel = document.getElementById('panel-'+chap+'-quiz');
 const qs = QUIZ[chap];
 let html = '<div class="card"><div class="qBar"><div class="progressBar"><i id="qBar'+chap+'" style="width:0%"></i></div><div style="font-size:13px;color:var(--sub)">Chapter '+chap+' · '+qs.length+'문제 · <span id="qDone'+chap+'">0</span>개 완료</div></div>';
 qs.forEach((q,i)=>{
 const badge = q.diff==='easy'?'<span class="diffBadge easy">난이도 1 · 쉬움</span>':'<span class="diffBadge hard">난이도 2 · 어려움</span>';
 const done = userAnswers[q.id];
 html += '<div style="margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--soft)">';
 html += '<div style="font-weight:700;color:#3730a3">'+chap+'-'+(i+1)+' 문제 '+badge+'</div>';
 html += '<div style="margin-top:6px;font-size:15.5px">'+q.q+'</div>';
 html += '<input class="ansInput" data-id="'+q.id+'" placeholder="정답을 입력해 주세요"'+(done?' value="'+esc(done.val)+'" disabled':'')+'>';
 html += '<div style="margin-top:8px"><button class="btn go" data-check="'+q.id+'"'+(done?' disabled':'')+'>정답 확인</button></div>';
 html += '<div class="fb '+(done?' show '+(done.right?'ok':'no'):'')+'" id="fb_'+q.id+'">';
 if (done) html += done.right ? '<div class="head">✅ 정답이에요!</div><div class="explain">📖 '+q.explain+'</div>' : '<div class="head">❌ 다시 생각해 볼까요?</div><div class="ansLine">내가 쓴 답: <b>'+esc(done.val)+'</b> · 정답: <b>'+esc(q.accept[0])+'</b> (또는 '+q.accept.map(a => '"'+a+'"').join(', ')+' 모두 정답)</div><div class="explain">📖 '+q.explain+'</div>';
 html += '</div></div>';
 });
 if (chap === '3') html += '<div style="margin-top:18px;text-align:center"><button class="btn go" id="finalBtn">🏁 결과 보기</button></div>';
 html += '</div>';
 panel.innerHTML = html;
 panel.querySelectorAll(".ansInput").forEach(inp => inp.addEventListener('keydown', e => { if (e.key==='Enter') checkAnswer(inp.dataset.id, inp.value); }));
 panel.querySelectorAll("[data-check]").forEach(b => b.addEventListener('click', () => { const inp = panel.querySelector('.ansInput[data-id="'+b.dataset.check+'"]'); checkAnswer(b.dataset.check, inp.value); }));
 if (chap === '3') document.getElementById('finalBtn').addEventListener('click', showResults);
 document.querySelectorAll("input.ansInput[data-id]").forEach(inp => {
 // disabled 처리 외 키 이벤트 추가
 });
 refreshNav();
}
function checkAnswer(id, rawVal){
 const inp = document.querySelector('.ansInput[data-id="'+id+'"]');
 const fb = document.getElementById('fb_'+id);
 if (!inp||!fb) return;
 const v = String(rawVal).trim().replace(/\s+/g,' ');
 if (!v){ inp.focus(); return; }
 const btn = inp.parentElement.querySelector('button');
 if (fb.classList.contains('show')) return;
 let q=null; for (const ch in QUIZ){ for (const qq of QUIZ[ch]){ if (qq.id===id){ q=qq; break; } } }
 const right = q.accept.some(a => String(a).trim().replace(/\s+/g,' ') === v);
 userAnswers[id] = { val:rawVal, right:right };
 inp.disabled = true; if (btn) btn.disabled = true;
 fb.className = 'fb ' + (right?'ok':'no') + ' show';
 fb.innerHTML = right ? '<div class="head">✅ 정답이에요!</div><div class="explain">📖 '+q.explain+'</div>' : '<div class="head">❌ 다시 생각해 볼까요?</div><div class="ansLine">내가 쓴 답: <b>'+esc(rawVal)+'</b> · 정답: <b>'+esc(q.accept[0])+'</b> (또는 '+q.accept.map(a => '"'+a+'"').join(', ')+' 모두 정답)</div><div class="explain">📖 '+q.explain+'</div>';
 refreshNav();
}

/* ============================================================
   OX 퀴즈
   ============================================================ */
const userOX = {};
function renderOX(){
 const easyList = OX.filter(o => o.diff==='easy');
 const hardList = OX.filter(o => o.diff==='hard');
 const panel = document.getElementById('panel-3-ox');
 let html = '<div class="card"><div class="qBar"><div class="progressBar" style="width:240px"><i id="oxBar" style="width:0%"></i></div><div style="font-size:13px;color:var(--sub)">쉬움 10 + 어려움 10 · <span id="oxDone">0</span>/20 완료</div></div>';
 html += '<div class="oxCol"><div><div style="font-weight:800;color:#15803d;margin-bottom:6px">🟢 쉬움 (10)</div>';
 easyList.forEach(q => html += oxCardHTML(q));
 html += '</div><div><div style="font-weight:800;color:#b91c1c;margin-bottom:6px">🔴 어려움 (10)</div>';
 hardList.forEach(q => html += oxCardHTML(q));
 html += '</div></div>';
 html += '<div id="oxResultBox" style="margin-top:18px"></div></div>';
 panel.innerHTML = html;
 // 이벤트 위임
 panel.addEventListener('click', e => {
 const btn = e.target.closest('[data-ox]');
 if (!btn) return;
 const id = btn.dataset.ox, choice = btn.dataset.choice;
 const q = OX.find(o => o.id===id);
 if (!q || userOX[id]) return;
 userOX[id] = { choice:choice, right: choice===q.answer };
 renderOX(); refreshNav();
 });
 const n = Object.keys(userOX).length;
 const b1 = document.getElementById('oxDone'); if (b1) b1.textContent = n;
 const b2 = document.getElementById('oxBar'); if (b2) b2.style.width = (n/OX.length*100) + '%';
 updateOXResult();
}
function oxCardHTML(q){
 const done = userOX[q.id];
 let body = '<div class="oxCard" style="border-left:4px solid '+(q.diff==='easy'?'#15803d':'#b91c1c')+'">';
 body += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><span class="diffBadge '+(q.diff==='easy'?'easy':'hard')+'">'+(q.diff==='easy'?'쉬움':'어려움')+'</span><span class="oxName">'+esc(q.text)+'</span><span style="font-size:13px;color:var(--sub);margin-left:auto">← 변수 이름?</span></div>';
 if (done){
 body += '<div class="oxChoiceRow"><button class="oxOXBtn O" disabled>⭕ O</button><button class="oxOXBtn X" disabled>❌ X</button></div>';
 body += '<div class="fb '+(done.right?'ok':'no')+' show"><div class="head">'+(done.right?'✅ 정답!':'❌ 아쉬워요!')+'</div><div class="ansLine">정답: <b>'+q.answer+'</b> · 내가 고른 답: <b>'+done.choice+'</b></div><div class="explain">📖 '+q.explain+'</div></div>';
 } else {
 body += '<div class="oxChoiceRow"><button data-ox="'+q.id+'" data-choice="O" class="oxOXBtn O">⭕ O — 변수 OK</button><button data-ox="'+q.id+'" data-choice="X" class="oxOXBtn X">❌ X — 변수 불가</button></div>';
 }
 body += '</div>';
 return body;
}
function updateOXResult(){
 const box = document.getElementById('oxResultBox');
 if (!box) return;
 const ks = Object.keys(userOX);
 if (ks.length === 0){
 box.innerHTML = '<div style="background:var(--soft);border:1px dashed var(--line);border-radius:14px;padding:18px;text-align:center;font-size:14.5px;color:var(--sub)">⬆ 위의 <b>⭕ O</b> 또는 <b>❌ X</b> 를 골라 채점해 보세요!</div>';
 return;
 }
 const o = Object.values(userOX).filter(a => a.right).length;
 const eOK = OX.filter(q => q.diff==='easy' && userOX[q.id] && userOX[q.id].right).length;
 const hOK = OX.filter(q => q.diff==='hard' && userOX[q.id] && userOX[q.id].right).length;
 const pct = Math.round(o/ks.length*100);
 const msg = pct===100?'완벽해요! 마스터! 👑':pct>=80?'아주 잘해요! 🌟':pct>=60?'꽤 잘했어요! 💪':pct>=40?'괜찮아요. 📖':'처음이라 충분! 🌱';
 box.innerHTML = '<div style="background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;text-align:center"><div style="font-size:30px;font-weight:800;color:#3730a3">OX 점수 '+o+' / '+ks.length+' · '+pct+'점</div><div style="margin-top:6px;color:var(--sub);font-size:15.5px">'+msg+'</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px"><div style="background:#ecfdf5;border-radius:10px;padding:12px"><div style="font-size:13px;color:#15803d;font-weight:800">🟢 쉬움</div><div style="font-size:24px;font-weight:800;color:#15803d">'+eOK+' / 10</div></div><div style="background:#fef2f2;border-radius:10px;padding:12px"><div style="font-size:13px;color:#b91c1c;font-weight:800">🔴 어려움</div><div style="font-size:24px;font-weight:800;color:#b91c1c">'+hOK+' / 10</div></div></div></div>';
}

/* ============================================================
   진행률 / 결과 분석
   ============================================================ */
function refreshNav(){
 const ans = Object.keys(userAnswers).length;
 const oxAns = Object.keys(userOX).length;
 const tot = ans + oxAns;
 const ok = Object.values(userAnswers).filter(a => a.right).length;
 const oxOk = Object.values(userOX).filter(a => a.right).length;
 const pb = document.getElementById('pbar');
 if (pb) pb.style.width = (tot/80*100) + '%';
 const nc = document.getElementById('navCount');
 if (nc) nc.textContent = tot + '/80 완료 · 정답 ' + (ok+oxOk);
 // 챕터별 진행 바도 갱신
 ['1','2','3'].forEach(ch => {
 const bar = document.getElementById('qBar'+ch);
 const ans = QUIZ[ch].filter(q => userAnswers[q.id]).length;
 if (bar) bar.style.width = (ans/QUIZ[ch].length*100)+'%';
 const done = document.getElementById('qDone'+ch);
 if (done) done.textContent = ans;
 });
}
function showResults(){
 const stats = {1:{easy:{n:0,o:0},hard:{n:0,o:0}},2:{easy:{n:0,o:0},hard:{n:0,o:0}},3:{easy:{n:0,o:0},hard:{n:0,o:0}}};
 const totalN = 60, totalO = Object.values(userAnswers).filter(a => a.right).length, answeredN = Object.keys(userAnswers).length;
 for (const ch in QUIZ){ QUIZ[ch].forEach(q => { stats[ch][q.diff].n++; if (userAnswers[q.id]?.right) stats[ch][q.diff].o++; }); }
 const pct = Math.round(totalO/totalN*100);
 // 결과 차트 삽입 위치
 let anchor = document.getElementById('resultsAnchor');
 if (!anchor){
 anchor = document.createElement('section');
 anchor.id = 'resultsAnchor';
 document.getElementById('chapContainer').after(anchor);
 }
 const items = [
 {label:"print·쉬움",n:stats[1].easy.n,o:stats[1].easy.o},
 {label:"print·어려움",n:stats[1].hard.n,o:stats[1].hard.o},
 {label:"연산자·쉬움",n:stats[2].easy.n,o:stats[2].easy.o},
 {label:"연산자·어려움",n:stats[2].hard.n,o:stats[2].hard.o},
 {label:"변수·쉬움",n:stats[3].easy.n,o:stats[3].easy.o},
 {label:"변수·어려움",n:stats[3].hard.n,o:stats[3].hard.o}];
 const W=760,H=320,ML=60,MR=20,MT=20,MB=50;
 const innerW=W-ML-MR,innerH=H-MT-MB,bw=innerW/items.length*0.6,gap=innerW/items.length;
 let svg='';
 for(let i=0;i<=4;i++){ const y=MT+innerH*(i/4); svg+='<line x1="'+ML+'" y1="'+y+'" x2="'+(W-MR)+'" y2="'+y+'" stroke="#e5e9f7" stroke-dasharray="3,3"/><text x="'+(ML-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="#6b7280">'+(100-i*25)+'%</text>'; }
 items.forEach((it,i)=>{ const x=ML+gap*i+(gap-bw)/2,pv=it.n?it.o/it.n*100:0,bh=(pv/100)*innerH,y=MT+innerH-bh,col=pv>=80?'#16a34a':pv>=60?'#f59e0b':'#ef4444'; svg += '<rect x="'+x+'" y="'+(y+3)+'" width="'+bw+'" height="'+bh+'" fill="#000" opacity=".06" rx="6"/><rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+bh+'" fill="'+col+'" rx="6"/><text x="'+(x+bw/2)+'" y="'+(y-6)+'" text-anchor="middle" font-size="12" font-weight="700">'+(it.n?Math.round(pv)+'%':'–')+'</text><text x="'+(x+bw/2)+'" y="'+(H-MB+18)+'" text-anchor="middle" font-size="11">'+it.label+'</text><text x="'+(x+bw/2)+'" y="'+(H-MB+33)+'" text-anchor="middle" font-size="10" fill="#9ca3af">'+it.o+'/'+it.n+'</text>'; });
 anchor.innerHTML = `<div class="card" style="text-align:center;padding:30px 20px"><div style="font-size:50px">🏁</div><div style="font-size:30px;font-weight:800;color:#3730a3;margin:8px 0">총 ${totalO} / ${totalN} 정답 · ${pct}점</div><div style="color:var(--sub);font-size:16px;margin-bottom:18px">${pct>=90?'완벽! 👑':pct>=70?'잘했어요!':pct>=50?'괜찮아요!':'처음이라 충분!'}</div><div class="endChartBox"><h4 style="font-size:16px;color:#3730a3;margin-bottom:6px">📊 영역별 분석</h4>${svg}</div><button class="btn go" id="restartBtn">🔄 다시 풀기</button></div>`;
 document.getElementById('restartBtn').addEventListener('click', () => {
 for (const k in userAnswers) delete userAnswers[k];
 for (const k in userOX) delete userOX[k];
 anchor.innerHTML = '';
 refreshNav();
 window.scrollTo({top:0, behavior:'smooth'});
 });
 anchor.scrollIntoView({behavior:'smooth', block:'start'});
}

/* ============================================================
   탭 표시/숨김 (v4 핵심: CSS class .hide 로 명확히 처리)
   ============================================================ */
function showPanel(ch, part){
 // 같은 챕터의 모든 패널 hide 후 선택한 것만 표시
 document.querySelectorAll(`.partPanel[data-chap="${ch}"]`).forEach(p => p.classList.add('hide'));
 const target = document.getElementById('panel-'+ch+'-'+part);
 if (target) target.classList.remove('hide');
 // 탭 active
 const grp = document.querySelector(`.partTabs[data-chap="${ch}"]`);
 if (grp){
 grp.querySelectorAll('.partTab').forEach(b => b.classList.remove('active'));
 const btn = grp.querySelector(`.partTab[data-part="${part}"]`);
 if (btn) btn.classList.add('active');
 }
 // 동적 콘텐츠
 if (part === 'practice') loadTypeExercise(ch);
 else if (part === 'quiz') renderQuiz(ch);
 else if (part === 'ox') renderOX();
}
